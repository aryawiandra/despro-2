; Buka folder ini (Week6/espnow/sender) di VS Code dengan ekstensi PlatformIO IDE.
; src_dir = . supaya sender.ino dipakai langsung (tidak perlu salinan di src/).
[platformio]
src_dir = .

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; kirim per baris saat Enter ditekan (perintah block/clear/list di sender)
monitor_filters = send_on_enter, default
monitor_echo = yes
monitor_eol = LF

; Buka folder ini (Week6/espnow/receiver) di VS Code dengan ekstensi PlatformIO IDE.
; src_dir = . supaya receiver.ino dipakai langsung (tidak perlu salinan di src/).
[platformio]
src_dir = .

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
lib_deps = adafruit/Adafruit NeoPixel
monitor_speed = 115200
; kirim per baris saat Enter ditekan (perintah room/status di hub)
monitor_filters = send_on_enter, default
monitor_echo = yes
monitor_eol = LF
